<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>GOAT ARENA LIVE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="gameScreen" class="game-screen">

        <!-- LEFT: NARENDRA MODI -->
        <section id="modiSide" class="side left-side">

            <div id="modiCrown" class="crown">👑</div>

            <div class="main-name">नरेंद्र मोदी</div>

            <div class="small-name">नरेंद्र मोदी</div>

            <div id="modiCounter" class="counter">00</div>

        </section>


        <!-- RIGHT: RAHUL GANDHI -->
        <section id="rahulSide" class="side right-side">

            <div id="rahulCrown" class="crown">👑</div>

            <div class="main-name">राहुल गांधी</div>

            <div class="small-name">राहुल गांधी</div>

            <div id="rahulCounter" class="counter">00</div>

        </section>


        <!-- CENTER LINE -->
        <div class="center-line"></div>


        <!-- CHANNEL HEADER -->
        <div class="channel-header">

            <img
                src="logo.png"
                class="channel-logo"
                alt="GOAT ARENA LIVE"
            >

            <div class="channel-title">
                GOAT ARENA LIVE
            </div>

        </div>


        <!-- RESET -->
        <button id="resetButton" class="reset-button">
            RESET
        </button>


        <!-- FULLSCREEN -->
        <button id="fullscreenButton" class="fullscreen-button">
            ⛶ FULL SCREEN
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
