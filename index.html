<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GOAT ARENA LIVE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="arena">

        <!-- =========================
             LEFT SIDE — NARENDRA MODI
        ========================== -->

        <section
            class="side left-side"
            id="modiSide"
        >

            <!-- Crown -->
            <div
                class="crown"
                id="modiCrown"
            >
                👑
            </div>

            <!-- Main Name -->
            <div class="main-name">
                नरेंद्र मोदी
            </div>

            <!-- Small Name -->
            <div class="small-name">
                नरेंद्र मोदी
            </div>

            <!-- Live Counter -->
            <div
                class="counter"
                id="modiCounter"
            >
                00
            </div>

        </section>


        <!-- =========================
             RIGHT SIDE — RAHUL GANDHI
        ========================== -->

        <section
            class="side right-side"
            id="rahulSide"
        >

            <!-- Crown -->
            <div
                class="crown"
                id="rahulCrown"
            >
                👑
            </div>

            <!-- Main Name -->
            <div class="main-name">
                राहुल गांधी
            </div>

            <!-- Small Name -->
            <div class="small-name">
                राहुल गांधी
            </div>

            <!-- Live Counter -->
            <div
                class="counter"
                id="rahulCounter"
            >
                00
            </div>

        </section>


        <!-- =========================
             CENTER DIVIDER
        ========================== -->

        <div class="center-line"></div>


        <!-- =========================
             CHANNEL HEADER
        ========================== -->

        <div class="channel-header">

            <!-- अपनी channel logo PNG -->
            <img
                src="logo.png"
                class="channel-logo"
                alt="GOAT ARENA LIVE"
            >

            <div class="channel-title">
                GOAT ARENA LIVE
            </div>

        </div>


        <!-- =========================
             RESET BUTTON
        ========================== -->

        <button
            type="button"
            class="reset-button"
            id="resetButton"
        >
            RESET
        </button>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
