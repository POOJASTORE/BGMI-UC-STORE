<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>GOAT ARENA LIVE</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="arena">

    <!-- ================= LEFT ================= -->

    <section id="modiSide"
             class="vote-side modi-side">

        <div id="modiCrown"
             class="crown">
            👑
        </div>

        <div class="person-name">
            नरेंद्र मोदी
        </div>

        <div id="modiCounter"
             class="vote-counter">
            00
        </div>

    </section>


    <!-- ================= RIGHT ================= -->

    <section id="rahulSide"
             class="vote-side rahul-side">

        <div id="rahulCrown"
             class="crown">
            👑
        </div>

        <div class="person-name">
            राहुल गांधी
        </div>

        <div id="rahulCounter"
             class="vote-counter">
            00
        </div>

    </section>


    <!-- CENTER LINE -->

    <div class="center-divider"></div>


    <!-- ================= CHANNEL HEADER ================= -->

    <div class="channel-header">

        <img
            src="logo.png"
            class="channel-logo"
            alt="GOAT ARENA LIVE"
        >

        <div class="channel-name">
            GOAT ARENA LIVE
        </div>

    </div>


    <!-- ================= RESET ================= -->

    <button
        id="resetButton"
        class="reset-button"
        type="button">

        RESET

    </button>

</div>


<script src="script.js"></script>

</body>
</html>
