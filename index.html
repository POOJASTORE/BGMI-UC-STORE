<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>GOAT ARENA LIVE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    position:fixed;
    inset:0;
}

#arena{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    overflow:hidden;
    background:#000;
}

/* =========================
   SIDES
========================= */

.vote-side{
    position:relative;
    width:50%;
    height:100%;
    flex:0 0 50%;
    overflow:hidden;
    cursor:pointer;
    touch-action:none;
}

.modi-side{
    background:linear-gradient(
        180deg,
        #ff2b7c 0%,
        #f90069 50%,
        #e80060 100%
    );
    color:#fff;
}

.rahul-side{
    background:linear-gradient(
        180deg,
        #fff500 0%,
        #ffe900 50%,
        #ffd000 100%
    );
    color:#000;
}

/* =========================
   CENTER LINE
========================= */

.center-divider{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:5px;
    transform:translateX(-50%);
    background:#fff;
    z-index:20;
    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.channel-header{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    height:82px;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;

    border-radius:50px;

    background:linear-gradient(
        100deg,
        rgba(45,0,25,.97),
        rgba(35,5,20,.97),
        rgba(55,55,0,.95)
    );

    z-index:100;
    pointer-events:none;
    white-space:nowrap;
}

.channel-logo{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    display:block;
}

.channel-name{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:27px;
    font-weight:900;
    line-height:1;
}

/* =========================
   RESET
========================= */

#resetButton{
    position:absolute;
    top:125px;
    left:50%;
    transform:translateX(-50%);

    width:100px;
    height:100px;

    border:0;
    border-radius:50%;

    background:#181219;
    color:#fff;

    font-family:Arial,Helvetica,sans-serif;
    font-size:19px;
    font-weight:900;

    z-index:200;
    cursor:pointer;
    touch-action:manipulation;
}

#resetButton:active{
    transform:translateX(-50%) scale(.92);
}

/* =========================
   NAMES
========================= */

.person-name{
    position:absolute;

    top:35%;
    left:3%;
    right:3%;

    text-align:center;

    font-family:Arial,
        "Noto Sans Devanagari",
        sans-serif;

    font-size:clamp(22px,4.5vw,58px);
    font-weight:900;
    line-height:1.1;

    z-index:5;
    pointer-events:none;
}

.modi-side .person-name{
    color:#fff;
}

.rahul-side .person-name{
    color:#000;
}

/* =========================
   COUNTERS
========================= */

.vote-counter{
    position:absolute;

    top:51%;
    left:0;
    right:0;

    text-align:center;

    font-family:Arial,Helvetica,sans-serif;

    font-size:clamp(65px,12vw,170px);
    font-weight:900;

    line-height:1;
    letter-spacing:-4px;

    z-index:5;
    pointer-events:none;
}

.modi-side .vote-counter{
    color:#fff;
}

.rahul-side .vote-counter{
    color:#000;
}

.vote-counter.pop{
    animation:counterPop .15s ease;
}

@keyframes counterPop{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   CROWN
========================= */

.crown{
    position:absolute;

    top:23%;
    left:50%;

    transform:translateX(-50%) scale(.7);

    font-size:clamp(35px,6vw,75px);

    opacity:0;
    visibility:hidden;

    z-index:8;
    pointer-events:none;

    transition:
        opacity .15s ease,
        transform .15s ease;
}

.crown.active{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        scale(1);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .channel-header{
        top:10px;
        height:58px;
        padding:0 15px;
        gap:9px;
        border-radius:35px;
    }

    .channel-logo{
        width:42px;
        height:42px;
    }

    .channel-name{
        font-size:16px;
    }

    #resetButton{
        top:78px;
        width:64px;
        height:64px;
        font-size:12px;
    }

    .person-name{
        top:35%;
        font-size:clamp(19px,5.5vw,34px);
    }

    .vote-counter{
        top:51%;
        font-size:clamp(55px,18vw,105px);
        letter-spacing:-3px;
    }

    .crown{
        top:22%;
        font-size:40px;
    }
}

/* =========================
   LANDSCAPE MOBILE
========================= */

@media(orientation:landscape) and (max-height:600px){

    .channel-header{
        top:7px;
        height:52px;
        padding:0 15px;
        gap:8px;
    }

    .channel-logo{
        width:38px;
        height:38px;
    }

    .channel-name{
        font-size:15px;
    }

    #resetButton{
        top:64px;
        width:55px;
        height:55px;
        font-size:10px;
    }

    .person-name{
        top:34%;
        font-size:clamp(22px,4.5vw,46px);
    }

    .vote-counter{
        top:49%;
        font-size:clamp(60px,12vw,125px);
    }

    .crown{
        top:19%;
        font-size:40px;
    }
}
</style>
</head>

<body>

<div id="arena">

    <!-- LEFT SIDE -->

    <section
        id="modiSide"
        class="vote-side modi-side"
    >

        <div id="modiCrown" class="crown">
            👑
        </div>

        <div class="person-name">
            नरेंद्र मोदी
        </div>

        <div
            id="modiCounter"
            class="vote-counter"
        >
            00
        </div>

    </section>


    <!-- RIGHT SIDE -->

    <section
        id="rahulSide"
        class="vote-side rahul-side"
    >

        <div id="rahulCrown" class="crown">
            👑
        </div>

        <div class="person-name">
            राहुल गांधी
        </div>

        <div
            id="rahulCounter"
            class="vote-counter"
        >
            00
        </div>

    </section>


    <!-- CENTER -->

    <div class="center-divider"></div>


    <!-- CHANNEL -->

    <div class="channel-header">

        <img
            src="logo.png"
            class="channel-logo"
            alt="GOAT ARENA LIVE"
        >

        <div class="channel-name">
            GOAT ARENA LIVE
        </div>

    </div>


    <!-- ONLY BUTTON -->

    <button
        id="resetButton"
        type="button"
    >
        RESET
    </button>

</div>


<script>

/* =====================================
   VOTE COUNTERS
===================================== */

let modiVotes = 0;
let rahulVotes = 0;


/* =====================================
   GET ELEMENTS
===================================== */

const modiSide =
    document.getElementById("modiSide");

const rahulSide =
    document.getElementById("rahulSide");

const modiCounter =
    document.getElementById("modiCounter");

const rahulCounter =
    document.getElementById("rahulCounter");

const modiCrown =
    document.getElementById("modiCrown");

const rahulCrown =
    document.getElementById("rahulCrown");

const resetButton =
    document.getElementById("resetButton");


/* =====================================
   FORMAT NUMBER
===================================== */

function formatNumber(number){

    return String(number).padStart(2,"0");

}


/* =====================================
   UPDATE SCREEN
===================================== */

function updateScreen(){

    modiCounter.textContent =
        formatNumber(modiVotes);

    rahulCounter.textContent =
        formatNumber(rahulVotes);


    modiCrown.classList.remove("active");
    rahulCrown.classList.remove("active");


    if(modiVotes > rahulVotes){

        modiCrown.classList.add("active");

    }

    if(rahulVotes > modiVotes){

        rahulCrown.classList.add("active");

    }

}


/* =====================================
   COUNTER ANIMATION
===================================== */

function animateCounter(element){

    element.classList.remove("pop");

    void element.offsetWidth;

    element.classList.add("pop");

}


/* =====================================
   SPEECH
===================================== */

function speakHindi(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    try{

        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "hi-IN";
        speech.rate = 0.9;
        speech.pitch = 1;
        speech.volume = 1;

        window.speechSynthesis.speak(speech);

    }catch(error){

        console.log(
            "Speech error:",
            error
        );

    }

}


/* =====================================
   FULLSCREEN
===================================== */

async function tryFullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document.documentElement.requestFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen:",
            error
        );

    }

}


/* =====================================
   MODI VOTE
===================================== */

function addModiVote(){

    modiVotes =
        modiVotes + 1;

    updateScreen();

    animateCounter(
        modiCounter
    );

    speakHindi(
        "नरेंद्र मोदी"
    );

    tryFullscreen();

}


/* =====================================
   RAHUL VOTE
===================================== */

function addRahulVote(){

    rahulVotes =
        rahulVotes + 1;

    updateScreen();

    animateCounter(
        rahulCounter
    );

    speakHindi(
        "राहुल गांधी"
    );

    tryFullscreen();

}


/* =====================================
   IMPORTANT:
   ONE POINTER EVENT ONLY
===================================== */

modiSide.addEventListener(
    "pointerup",
    function(event){

        if(event.button !== undefined &&
           event.button !== 0){

            return;

        }

        addModiVote();

    },
    {
        passive:true
    }
);


rahulSide.addEventListener(
    "pointerup",
    function(event){

        if(event.button !== undefined &&
           event.button !== 0){

            return;

        }

        addRahulVote();

    },
    {
        passive:true
    }
);


/* =====================================
   RESET
===================================== */

resetButton.addEventListener(
    "pointerup",
    function(event){

        event.stopPropagation();

        modiVotes = 0;
        rahulVotes = 0;

        updateScreen();

        if("speechSynthesis" in window){

            window.speechSynthesis.cancel();

        }

    },
    {
        passive:true
    }
);


/* =====================================
   START
===================================== */

updateScreen();

</script>

</body>
</html>
